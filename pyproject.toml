[project]
name = "hoken-poc"
version = "0.1.0"
description = "保険AI Bot PoC — khu A: nạp tài liệu, review, chunk, index"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30",
  "pillow>=10",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# Docling nặng (torch + model). Chỉ cài trong image worker-docling.
docling = ["docling>=2.31"]
azure = [
  "azure-identity>=1.17",
  "azure-cosmos>=4.7",
  "azure-storage-blob>=12.20",
  "azure-storage-queue>=12.10",
  "azure-keyvault-secrets>=4.8",
]
aws = ["boto3>=1.35", "requests-aws4auth>=1.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI: Depends()/File() trong tham số mặc định

[tool.pytest.ini_options]
testpaths = ["tests"]
