[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hoken-poc"
version = "0.1.0"
description = "保険AI Bot PoC — khu A: nạp tài liệu, review, chunk, index"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30",
  "pillow>=10",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# Parser (標準解析) nặng (torch / paddle + model). Chỉ cài trong image worker parser hoặc .venv-parser.
docling = ["docling>=2.31", "easyocr>=1.7"]  # Docling mới không còn kèm EasyOCR (OCR tiếng Nhật)
paddleocr = ["paddlepaddle>=3.0", "paddleocr[doc-parser]>=3.0"]
azure = [
  "azure-identity>=1.17",
  "azure-cosmos>=4.7",
  "azure-storage-blob>=12.20",
  "azure-storage-queue>=12.10",
]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "ruff>=0.6", "moto[dynamodb,s3,sqs]>=5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI: Depends()/File() trong tham số mặc định

[tool.pytest.ini_options]
testpaths = ["tests"]
